name: smart-tv
services:
  dashboard:
    build: .
    ports:
      - "${SMART_TV_BIND:-127.0.0.1}:8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      Immich__BaseUrl: ${IMMICH_URL:-http://host.docker.internal:2283/api/}
      Immich__ApiKey: ${IMMICH_API_KEY:-}
      Immich__AlbumIds: ${IMMICH_ALBUM_IDS:-}
      Weather__Latitude: ${WEATHER_LATITUDE:-32.7767}
      Weather__Longitude: ${WEATHER_LONGITUDE:--96.7970}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
